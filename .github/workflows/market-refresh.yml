name: Market Refresh (10 min)

# Intraday refresh during NSE session + catch-up when GitHub skips crons or on holidays.
# Keep Alive triggers catchup=true when pages are stale for today (IST).
# After a real refresh in market hours, the job queues the next run (chain=true)
# so one successful start covers the rest of the session even if */10 is dropped.

on:
  schedule:
    # GitHub honors ~02:35–02:50 UTC on this repo, then often drops jobs until ~07:45 UTC
    # (13:15 IST). Start the self-chain in that early band — laptop is not involved.
    - cron: '38 2 * * 1-5'   # 08:08 IST
    - cron: '52 2 * * 1-5'   # 08:22 IST
    - cron: '*/10 3-10 * * 1-5'
    - cron: '50 3 * * 1-5'   # 09:20 IST (often skipped; chain should already be running)
    - cron: '7 4 * * 1-5'
    - cron: '27 4 * * 1-5'
    - cron: '30 6 * * 1-5'
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
    inputs:
      catchup:
        description: Run even outside 9–16 IST (missed cron / holiday)
        required: false
        type: boolean
        default: false
      chain:
        description: Queued by the previous refresh — run only in market hours / if stale
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: master-data-push
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Sync to latest master
        run: bash scripts/ci-sync-master.sh

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Refresh gate (market hours or stale catch-up)
        id: gate
        env:
          INPUT_CATCHUP: ${{ github.event.inputs.catchup || 'false' }}
          INPUT_CHAIN: ${{ github.event.inputs.chain || 'false' }}
        run: bash scripts/ci-refresh-gate.sh

      - name: Run full market refresh
        if: steps.gate.outputs.skip != 'true'
        run: bash scripts/market-refresh.sh

      - name: Skipped
        if: steps.gate.outputs.skip == 'true'
        run: echo "Skipped (${{ steps.gate.outputs.reason }})"

      - name: Queue next refresh during market hours
        if: always() && steps.gate.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-queue-next-refresh.sh
