name: Market Refresh (10 min)

# Intraday refresh during NSE session + catch-up when GitHub skips crons or on holidays.
# Keep Alive triggers catchup=true when pages are stale for today (IST).
# The next run is queued at the START of this job (chain=true), before any
# wait. A pre-session chain sleeps at most 40 minutes, then the successor
# continues. One job must not sleep until 08:05 — the 210-minute timeout
# killed that wait on 14 Oct 2026 and the session never started.

on:
  schedule:
    # GitHub honors ~02:35–02:50 UTC on this repo, then often drops jobs until ~07:45 UTC
    # (13:15 IST). Start the self-chain in that early band — laptop is not involved.
    - cron: '38 2 * * 1-5'   # 08:08 IST
    - cron: '52 2 * * 1-5'   # 08:22 IST
    - cron: '*/10 3-10 * * 1-5'
    - cron: '50 3 * * 1-5'   # 09:20 IST (often skipped; chain should already be running)
    - cron: '7 4 * * 1-5'
    - cron: '27 4 * * 1-5'
    - cron: '30 6 * * 1-5'
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
    inputs:
      catchup:
        description: Run even outside 9–16 IST (missed cron / holiday)
        required: false
        type: boolean
        default: false
      chain:
        description: Queued by the previous refresh — run only in market hours / if stale
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: master-data-push
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Sync to latest master
        run: bash scripts/ci-sync-master.sh

      # Before any sleep or refresh. If this job is later cancelled, the
      # successor is already waiting and starts when the concurrency lock frees.
      - name: Queue next refresh before this job can be killed
        id: early
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-queue-next-refresh.sh

      - name: Wait one hop toward 08:05 IST when chained early
        id: wait
        if: github.event.inputs.chain == 'true'
        run: bash scripts/ci-wait-session.sh

      - uses: actions/setup-node@v7
        if: steps.wait.outputs.ready != 'false'
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci
        if: steps.wait.outputs.ready != 'false'

      - name: Refresh gate (market hours or stale catch-up)
        id: gate
        if: steps.wait.outputs.ready != 'false'
        env:
          INPUT_CATCHUP: ${{ github.event.inputs.catchup || 'false' }}
          INPUT_CHAIN: ${{ github.event.inputs.chain || 'false' }}
        run: bash scripts/ci-refresh-gate.sh

      - name: Run full market refresh
        if: steps.wait.outputs.ready != 'false' && steps.gate.outputs.skip != 'true'
        timeout-minutes: 45
        run: bash scripts/market-refresh.sh

      # Site publishes from master /docs — every data push updates GitHub Pages
      # directly. No separate Deploy workflow (GITHUB_TOKEN-chained runs could not
      # trigger workflow_run → Deploy, which left the site on overnight prices).

      - name: Skipped
        if: steps.gate.outputs.skip == 'true'
        run: echo "Skipped (${{ steps.gate.outputs.reason }})"

      - name: Queue next refresh if the early queue did not land
        if: always() && steps.early.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-queue-next-refresh.sh
