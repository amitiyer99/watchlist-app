name: Market Refresh (10 min)

# Single intraday pipeline: regenerates ALL docs/*.html pages every 10 minutes
# during NSE cash session (Mon–Fri ~8:30 AM–4:20 PM IST).
# Replaces fragmented monitor/breakout schedules that GitHub often skips.

on:
  schedule:
    - cron: '*/10 3-10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: master-data-push
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Skip outside NSE session (IST 9:00–16:00, Mon–Fri)
        id: gate
        run: |
          DOW=$(TZ=Asia/Kolkata date +%u)
          HOUR=$(TZ=Asia/Kolkata date +%H)
          echo "IST weekday=$DOW hour=$HOUR"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ "$DOW" -gt 5 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Weekend — skip"
            exit 0
          fi
          if [ "$HOUR" -lt 9 ] || [ "$HOUR" -ge 16 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Outside IST 9–16 — skip"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Run full market refresh
        if: steps.gate.outputs.skip != 'true'
        run: bash scripts/market-refresh.sh
