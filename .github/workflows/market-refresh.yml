name: Market Refresh (10 min)

# Intraday refresh during NSE session + catch-up when GitHub skips crons or on holidays.
# Keep Alive triggers catchup=true when pages are stale for today (IST).

on:
  schedule:
    - cron: '*/10 3-10 * * 1-5'
    - cron: '0 4 * * 1-5'
    - cron: '30 6 * * 1-5'
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
    inputs:
      catchup:
        description: Run even outside 9–16 IST (missed cron / holiday)
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: master-data-push
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Refresh gate (market hours or stale catch-up)
        id: gate
        env:
          INPUT_CATCHUP: ${{ github.event.inputs.catchup || 'false' }}
        run: bash scripts/ci-refresh-gate.sh

      - name: Run full market refresh
        if: steps.gate.outputs.skip != 'true'
        run: bash scripts/market-refresh.sh

      - name: Skipped
        if: steps.gate.outputs.skip == 'true'
        run: echo "Skipped (${{ steps.gate.outputs.reason }})"
