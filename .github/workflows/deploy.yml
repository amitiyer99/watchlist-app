name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Stock Price Monitor"
      - "Breakout Scanner Refresh"
      - "Daily Refresh"
      - "Keep Alive"
    types: [completed]
    branches: [master]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip deploy when a data workflow failed (avoids publishing half-broken state)
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true
