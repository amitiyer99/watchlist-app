name: Keep Alive

# Heartbeat every 3h on weekdays so GitHub does not throttle scheduled crons.
# Page/price refresh during market hours is handled by market-refresh.yml.

on:
  schedule:
    - cron: '0 */3 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: master-data-push
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Commit heartbeat
        run: |
          printf '{"ts":"%s","day":"%s"}' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "$(date -u +%A)" \
            > .github/keepalive.json
          git add .github/keepalive.json
          bash scripts/ci-git-push.sh "keepalive: $(date -u +'%Y-%m-%d %H:%M') UTC"
