name: Keep Alive

# Heartbeat every 3h on weekdays (keeps scheduled workflows active).
# If pages/prices were not updated today IST, triggers a catch-up market refresh.

on:
  schedule:
    - cron: '0 */3 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: master-data-push
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check if site data is stale today (IST)
        id: stale
        run: bash scripts/ci-pages-stale.sh

      - name: Commit heartbeat
        run: |
          printf '{"ts":"%s","day":"%s"}' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "$(date -u +%A)" \
            > .github/keepalive.json
          git add .github/keepalive.json
          bash scripts/ci-git-push.sh "keepalive: $(date -u +'%Y-%m-%d %H:%M') UTC"

      - name: Trigger catch-up market refresh
        if: steps.stale.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Stale pages — dispatching Market Refresh (catchup)"
          gh workflow run "Market Refresh (10 min)" \
            --repo "${{ github.repository }}" \
            -f catchup=true
