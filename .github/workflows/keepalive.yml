name: Keep Alive

# Heartbeat on weekdays (keeps scheduled workflows active).
# From 08:00 IST, treats live-prices older than 20 minutes as stale so the
# ~08:18 weekday Keep Alive can start the in-session chain (GitHub often drops
# every cron after that until mid-afternoon).

on:
  schedule:
    - cron: '0 */3 * * 1-5'
    # Extra pings in the 08:05–08:20 IST band GitHub actually runs for this repo.
    - cron: '35 2 * * 1-5'
    - cron: '48 2 * * 1-5'
    # Every 20 min 08:37–16:17 IST (often skipped; chain should already be running).
    - cron: '7,27,47 3-10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: keepalive-heartbeat
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Sync to latest master
        run: bash scripts/ci-sync-master.sh

      - name: Check if site data is stale today (IST)
        id: stale
        run: bash scripts/ci-pages-stale.sh

      - name: Commit heartbeat
        run: |
          printf '{"ts":"%s","day":"%s"}' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "$(date -u +%A)" \
            > .github/keepalive.json
          git add .github/keepalive.json
          bash scripts/ci-git-push.sh "keepalive: $(date -u +'%Y-%m-%d %H:%M') UTC"

      - name: Trigger catch-up market refresh
        if: steps.stale.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Stale (${{ steps.stale.outputs.reason }}) — dispatching Market Refresh (catchup)"
          gh workflow run "Market Refresh (10 min)" \
            --repo "${{ github.repository }}" \
            -f catchup=true
