name: Daily Refresh

on:
  schedule:
    - cron: '46 3 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: master-data-push
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Check if daily pages already generated today (IST)
        id: check
        run: |
          LAST_ISO=$(git log -1 --format="%cI" -- docs/index.html 2>/dev/null || echo "")
          TODAY=$(TZ=Asia/Kolkata date +%Y-%m-%d)
          LAST_IST=""
          if [ -n "$LAST_ISO" ]; then LAST_IST=$(TZ=Asia/Kolkata date -d "$LAST_ISO" +%Y-%m-%d); fi
          echo "Last index.html: $LAST_ISO  |  Today IST: $TODAY  |  Last commit IST date: $LAST_IST"
          if [[ "$LAST_IST" == "$TODAY" ]]; then
            echo "already_done=true" >> $GITHUB_OUTPUT
            echo "Pages already generated today — skipping"
          else
            echo "already_done=false" >> $GITHUB_OUTPUT
            echo "Pages are stale — will regenerate"
          fi

      - name: Phase 0 — NSE delivery data
        if: steps.check.outputs.already_done == 'false'
        continue-on-error: true
        run: node fetch-nse-delivery.js

      - name: Phase 1 — fast generators (alerts + dashboard)
        if: steps.check.outputs.already_done == 'false'
        continue-on-error: true
        run: |
          node generate-alerts.js &
          node generate-dashboard.js &
          wait

      - name: Phase 2 — medium generators (potential + apex)
        if: steps.check.outputs.already_done == 'false'
        continue-on-error: true
        run: |
          node generate-potential.js &
          node generate-apex.js &
          wait

      - name: Phase 3 — heavy generators
        if: steps.check.outputs.already_done == 'false'
        continue-on-error: true
        run: |
          node generate-multibagger.js &
          node generate-creamy.js &
          node generate-sectors.js &
          node generate-indianresearch.js &
          wait
          node generate-confluence.js

      - name: Phase 3.5 — earnings calendar
        if: steps.check.outputs.already_done == 'false'
        continue-on-error: true
        run: node fetch-earnings-calendar.js

      - name: Phase 3.6 — rocket
        if: steps.check.outputs.already_done == 'false'
        continue-on-error: true
        run: node generate-rocket.js

      - name: Phase 4 — debate + prediction
        if: steps.check.outputs.already_done == 'false'
        continue-on-error: true
        run: |
          node generate-debate.js
          node generate-prediction.js

      - name: Phase 5 — outcome validation
        if: steps.check.outputs.already_done == 'false'
        continue-on-error: true
        run: node validate-screeners.js

      - name: Commit and push to master
        if: steps.check.outputs.already_done == 'false'
        run: |
          for f in docs/creamy.html docs/alerts.html docs/potential.html \
                   docs/multibagger.html docs/index.html docs/apex.html \
                   docs/sectors.html docs/indian-research.html docs/confluence.html \
                   docs/debate.html docs/debate-data.json \
                   docs/prediction.html docs/prediction-history.json \
                   docs/regime.json docs/screener-stats.json screener-outcomes.json \
                   docs/delivery.json docs/rocket.html docs/rocket-tickers.json \
                   docs/earnings-calendar.json; do
            [ -f "$f" ] && git add -f "$f" || true
          done
          bash scripts/ci-git-push.sh "data: daily refresh $(date -u +%Y-%m-%d)"
