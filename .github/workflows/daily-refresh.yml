name: Daily Refresh

on:
  schedule:
    - cron: '46 3 * * 1-5'  # 9:16 AM IST, Mon-Fri — offset from monitor (:00,:10) and breakout (:15,:45)
  workflow_run:
    workflows: ["Keep Alive"]  # backup trigger — Keep Alive fires every 3h and is never simultaneous with monitor
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Check if daily pages already generated today
        id: check
        run: |
          # Use IST calendar day (not UTC) for "already generated today"
          LAST_ISO=$(git log -1 --format="%cI" -- docs/index.html 2>/dev/null || echo "")
          TODAY=$(TZ=Asia/Kolkata date +%Y-%m-%d)
          LAST_IST=""
          if [ -n "$LAST_ISO" ]; then LAST_IST=$(TZ=Asia/Kolkata date -d "$LAST_ISO" +%Y-%m-%d); fi
          echo "Last index.html: $LAST_ISO  |  Today IST: $TODAY  |  Last commit IST date: $LAST_IST"
          if [[ "$LAST_IST" == "$TODAY" ]]; then
            echo "already_done=true" >> $GITHUB_OUTPUT
            echo "Pages already generated today — skipping"
          else
            echo "already_done=false" >> $GITHUB_OUTPUT
            echo "Pages are stale — will regenerate"
          fi

      - name: Phase 0 — NSE delivery data (small CSV, feeds apex + rocket)
        if: steps.check.outputs.already_done == 'false'
        continue-on-error: true
        run: node fetch-nse-delivery.js

      - name: Phase 1 — fast generators (alerts + dashboard)
        if: steps.check.outputs.already_done == 'false'
        continue-on-error: true
        run: |
          node generate-alerts.js &
          node generate-dashboard.js &
          wait

      - name: Phase 2 — medium generators (potential + apex)
        if: steps.check.outputs.already_done == 'false'
        continue-on-error: true
        run: |
          node generate-potential.js &
          node generate-apex.js &
          wait

      - name: Phase 3 — heavy generators (multibagger + creamy + sectors + india research)
        if: steps.check.outputs.already_done == 'false'
        continue-on-error: true
        run: |
          node generate-multibagger.js &
          node generate-creamy.js &
          node generate-sectors.js &
          node generate-indianresearch.js &
          wait
          node generate-confluence.js

      - name: Phase 3.5 — earnings calendar (feeds apex+debate gates)
        if: steps.check.outputs.already_done == 'false'
        continue-on-error: true
        run: node fetch-earnings-calendar.js

      - name: Phase 3.6 — rocket (small/mid-cap, depends on breakout2)
        if: steps.check.outputs.already_done == 'false'
        continue-on-error: true
        run: node generate-rocket.js

      - name: Phase 4 — debate + prediction (depends on screeners from phase 3)
        if: steps.check.outputs.already_done == 'false'
        continue-on-error: true
        run: |
          node generate-debate.js
          node generate-prediction.js

      - name: Phase 5 — outcome validation (forward returns vs Nifty)
        if: steps.check.outputs.already_done == 'false'
        continue-on-error: true
        run: node validate-screeners.js

      - name: Commit and push to master
        if: steps.check.outputs.already_done == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in docs/creamy.html docs/alerts.html docs/potential.html \
                   docs/multibagger.html docs/index.html docs/apex.html \
                   docs/sectors.html docs/indian-research.html docs/confluence.html \
                   docs/debate.html docs/debate-data.json \
                   docs/prediction.html docs/prediction-history.json \
                   docs/regime.json docs/screener-stats.json screener-outcomes.json \
                   docs/delivery.json docs/rocket.html docs/rocket-tickers.json \
                   docs/earnings-calendar.json; do
            [ -f "$f" ] && git add -f "$f" || true
          done
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "data: daily refresh $(date -u +%Y-%m-%d)"
          # Retry push up to 4 times to survive race with Breakout Scanner
          for i in 1 2 3 4; do
            git pull --rebase -Xours --autostash origin master
            git push origin master && break
            echo "Push attempt $i failed — retrying in 8s..."
            sleep 8
          done
