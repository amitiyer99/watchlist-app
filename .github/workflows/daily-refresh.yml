name: Daily Refresh

on:
  schedule:
    - cron: '46 3 * * 1-5'
    - cron: '0 5 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: master-data-push
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Check what still needs running today (IST)
        id: check
        run: |
          TODAY=$(TZ=Asia/Kolkata date +%Y-%m-%d)
          last_ist() {
            local f="$1"
            local iso
            iso=$(git log -1 --format="%cI" -- "$f" 2>/dev/null || echo "")
            if [ -z "$iso" ]; then echo ""; return; fi
            TZ=Asia/Kolkata date -d "$iso" +%Y-%m-%d
          }
          INDEX_IST=$(last_ist docs/index.html)
          STATS_IST=$(last_ist docs/screener-stats.json)
          DELIVERY_IST=$(last_ist docs/delivery.json)
          echo "Today IST: $TODAY | index: $INDEX_IST | screener-stats: $STATS_IST | delivery: $DELIVERY_IST"
          if [[ "$INDEX_IST" == "$TODAY" ]]; then
            echo "pages_done=true" >> $GITHUB_OUTPUT
            echo "HTML pages already refreshed today (market-refresh) — skip heavy regen"
          else
            echo "pages_done=false" >> $GITHUB_OUTPUT
            echo "HTML pages stale — will regenerate"
          fi
          if [[ "$STATS_IST" == "$TODAY" && "$DELIVERY_IST" == "$TODAY" ]]; then
            echo "extras_done=true" >> $GITHUB_OUTPUT
            echo "Daily extras already done today"
          else
            echo "extras_done=false" >> $GITHUB_OUTPUT
            echo "Will run delivery / earnings / validate"
          fi

      - name: Phase 0 — NSE delivery data
        if: steps.check.outputs.extras_done == 'false'
        continue-on-error: true
        run: node fetch-nse-delivery.js

      - name: Phase 0 — FII/DII flows
        if: steps.check.outputs.extras_done == 'false'
        continue-on-error: true
        run: node fetch-fii-dii.js

      - name: Phase 0.5 — macro context
        if: steps.check.outputs.pages_done == 'false'
        continue-on-error: true
        run: node fetch-macro.js

      - name: Phase 1 — fast generators (alerts + dashboard)
        if: steps.check.outputs.pages_done == 'false'
        continue-on-error: true
        run: |
          node generate-alerts.js &
          node generate-dashboard.js &
          wait

      - name: Phase 2 — medium generators (apex)
        if: steps.check.outputs.pages_done == 'false'
        continue-on-error: true
        run: node generate-apex.js

      - name: Phase 3 — heavy generators
        if: steps.check.outputs.pages_done == 'false'
        continue-on-error: true
        run: |
          node generate-multibagger.js &
          node generate-creamy.js &
          node generate-sectors.js &
          node generate-indianresearch.js &
          wait
          node generate-confluence.js

      - name: Phase 3.5 — earnings calendar
        if: steps.check.outputs.extras_done == 'false'
        continue-on-error: true
        run: node fetch-earnings-calendar.js

      - name: Phase 3.6 — rocket
        if: steps.check.outputs.pages_done == 'false'
        continue-on-error: true
        run: node generate-rocket.js

      - name: Phase 4 — debate + prediction
        if: steps.check.outputs.pages_done == 'false'
        continue-on-error: true
        run: |
          node generate-debate.js
          node generate-prediction.js

      - name: Phase 4.5 — Best Picks (leading page)
        if: steps.check.outputs.pages_done == 'false'
        continue-on-error: true
        run: node generate-bestpicks.js

      - name: Phase 5 — outcome validation
        if: steps.check.outputs.extras_done == 'false'
        continue-on-error: true
        run: node validate-screeners.js

      - name: Phase 5.5 — feature lab (backtest gating)
        if: steps.check.outputs.extras_done == 'false'
        continue-on-error: true
        run: node feature-lab.js

      - name: Phase 6 — learn adaptive weights
        if: steps.check.outputs.extras_done == 'false'
        continue-on-error: true
        run: node learn-weights.js

      - name: Commit and push to master
        if: steps.check.outputs.pages_done == 'false' || steps.check.outputs.extras_done == 'false'
        run: |
          for f in docs/creamy.html docs/alerts.html \
                   docs/multibagger.html docs/index.html docs/apex.html \
                   docs/sectors.html docs/indian-research.html docs/confluence.html \
                   docs/debate.html docs/debate-data.json \
                   docs/prediction.html docs/prediction-history.json \
                   docs/regime.json docs/screener-stats.json screener-outcomes.json \
                   screener-weights.json \
                   docs/macro.json docs/bestpicks.html docs/bestpicks-tickers.json \
                   docs/feature-report.json feature-history.jsonl \
                   docs/delivery.json docs/rocket.html docs/rocket-tickers.json \
                   docs/earnings-calendar.json docs/fii-dii.json; do
            [ -f "$f" ] && git add -f "$f" || true
          done
          bash scripts/ci-git-push.sh "data: daily refresh $(date -u +%Y-%m-%d)"

      - name: Nothing to do today
        if: steps.check.outputs.pages_done == 'true' && steps.check.outputs.extras_done == 'true'
        run: echo "All daily work already completed today — success"
