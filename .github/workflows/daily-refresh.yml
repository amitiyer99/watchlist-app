name: Daily Refresh

on:
  schedule:
    - cron: '46 3 * * 1-5'
    - cron: '0 5 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild every page even if they were already refreshed today (use after a source change)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: master-data-push
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Check what still needs running today (IST)
        id: check
        run: |
          # A manual run means "I changed the code, rebuild" — the freshness guard below
          # is only meant to avoid duplicate SCHEDULED work.
          FORCE="${{ github.event_name == 'workflow_dispatch' && (inputs.force == null || inputs.force) }}"
          if [[ "$FORCE" == "true" ]]; then
            echo "pages_done=false" >> $GITHUB_OUTPUT
            echo "extras_done=false" >> $GITHUB_OUTPUT
            echo "Manual run with force — regenerating everything regardless of today's timestamps"
            exit 0
          fi
          TODAY=$(TZ=Asia/Kolkata date +%Y-%m-%d)
          last_ist() {
            local f="$1"
            local iso
            iso=$(git log -1 --format="%cI" -- "$f" 2>/dev/null || echo "")
            if [ -z "$iso" ]; then echo ""; return; fi
            TZ=Asia/Kolkata date -d "$iso" +%Y-%m-%d
          }
          INDEX_IST=$(last_ist docs/index.html)
          STATS_IST=$(last_ist docs/screener-stats.json)
          DELIVERY_IST=$(last_ist docs/delivery.json)
          echo "Today IST: $TODAY | index: $INDEX_IST | screener-stats: $STATS_IST | delivery: $DELIVERY_IST"
          if [[ "$INDEX_IST" == "$TODAY" ]]; then
            echo "pages_done=true" >> $GITHUB_OUTPUT
            echo "HTML pages already refreshed today (market-refresh) — skip heavy regen"
          else
            echo "pages_done=false" >> $GITHUB_OUTPUT
            echo "HTML pages stale — will regenerate"
          fi
          if [[ "$STATS_IST" == "$TODAY" && "$DELIVERY_IST" == "$TODAY" ]]; then
            echo "extras_done=true" >> $GITHUB_OUTPUT
            echo "Daily extras already done today"
          else
            echo "extras_done=false" >> $GITHUB_OUTPUT
            echo "Will run delivery / earnings / validate"
          fi

      - name: Phase 0 — NSE delivery data
        if: steps.check.outputs.extras_done == 'false'
        continue-on-error: true
        run: node fetch-nse-delivery.js

      - name: Phase 0 — FII/DII flows
        if: steps.check.outputs.extras_done == 'false'
        continue-on-error: true
        run: node fetch-fii-dii.js

      - name: Phase 0 — NSE surveillance lists (ASM/GSM/F&O ban)
        if: steps.check.outputs.extras_done == 'false'
        continue-on-error: true
        run: node fetch-nse-surveillance.js

      - name: Phase 0 — NSE bulk/block deals
        if: steps.check.outputs.extras_done == 'false'
        continue-on-error: true
        run: node fetch-nse-deals.js

      - name: Phase 0.5 — macro context
        if: steps.check.outputs.pages_done == 'false'
        continue-on-error: true
        run: node fetch-macro.js

      - name: Phase 1 — fast generators (alerts + dashboard)
        if: steps.check.outputs.pages_done == 'false'
        continue-on-error: true
        run: |
          node generate-alerts.js &
          node generate-dashboard.js &
          wait

      - name: Phase 2 — medium generators (apex)
        if: steps.check.outputs.pages_done == 'false'
        continue-on-error: true
        run: node generate-apex.js

      - name: Phase 3 — heavy generators
        if: steps.check.outputs.pages_done == 'false'
        continue-on-error: true
        run: |
          node generate-multibagger.js &
          node generate-creamy.js &
          node generate-sectors.js &
          node generate-indianresearch.js &
          wait
          node generate-confluence.js
          node generate-fiidii.js
          node generate-investors.js

      - name: Phase 3.5 — earnings calendar
        if: steps.check.outputs.extras_done == 'false'
        continue-on-error: true
        run: node fetch-earnings-calendar.js

      - name: Phase 3.6 — rocket
        if: steps.check.outputs.pages_done == 'false'
        continue-on-error: true
        run: node generate-rocket.js

      # Triggers is the daily action list, but it only ever ran in market-refresh.sh —
      # so if a market refresh failed, or on a holiday, the most important page silently
      # stayed stale all day. This is the safety net: it rebuilds from the last committed
      # breakout2 sidecar (EOD data), which is exactly what an after-hours view should show.
      # Sniper follows because it reads docs/triggers.json.
      - name: Phase 3.7 — triggers (+ sniper, which reads triggers.json)
        if: steps.check.outputs.pages_done == 'false'
        continue-on-error: true
        run: |
          node generate-triggers.js
          node generate-sniper.js

      - name: Phase 4 — debate + prediction
        if: steps.check.outputs.pages_done == 'false'
        continue-on-error: true
        run: |
          node generate-debate.js
          node generate-prediction.js

      - name: Phase 4.5 — Best Picks (leading page)
        if: steps.check.outputs.pages_done == 'false'
        continue-on-error: true
        run: node generate-bestpicks.js

      - name: Phase 5 — outcome validation
        if: steps.check.outputs.extras_done == 'false'
        continue-on-error: true
        run: node validate-screeners.js

      - name: Phase 5.5 — feature lab (backtest gating)
        if: steps.check.outputs.extras_done == 'false'
        continue-on-error: true
        run: node feature-lab.js

      # Factor attribution: measures each Breakout GEN2 score BLOCK against realised
      # 20-day alpha and labels it LIVE / NEUTRAL / CONTRADICTED. Must run after
      # validate-screeners (which matures the outcomes) and before learn-weights (which
      # turns the verdicts into block weights) — that ordering IS the learning loop.
      - name: Phase 5.6 — factor lab (per-block attribution)
        if: steps.check.outputs.extras_done == 'false'
        continue-on-error: true
        run: node factor-lab.js --screener=all

      - name: Phase 6 — learn adaptive weights
        if: steps.check.outputs.extras_done == 'false'
        continue-on-error: true
        run: node learn-weights.js

      # Pipeline self-audit. Catches the SILENT failure classes that have bitten this
      # repo before — orphaned generators, unstaged outputs whose committed copy
      # freezes, stale artifacts, fail-open filters, broken inline page JS. Never
      # blocks the run; HIGH findings are raised as GitHub warning annotations so they
      # show on the Actions summary instead of dying in a log nobody reads.
      - name: Phase 6.7 — pipeline audit
        continue-on-error: true
        run: |
          node audit-pipeline.js || true
          if [ -f docs/pipeline-audit.json ]; then
            HIGH=$(node -e "try{const a=require('./docs/pipeline-audit.json');process.stdout.write(String((a.counts&&a.counts.HIGH)||0))}catch(e){process.stdout.write('0')}")
            if [ "$HIGH" != "0" ]; then
              echo "::warning title=Pipeline audit::${HIGH} HIGH finding(s) — see docs/pipeline-audit.json (orphaned/stale/broken pages)"
              node -e "const a=require('./docs/pipeline-audit.json');a.findings.filter(f=>f.sev==='HIGH').forEach(f=>console.log('::warning title='+f.cls+'::'+f.item+' — '+f.detail));" || true
            else
              echo "Pipeline audit: no HIGH findings."
            fi
          fi

      - name: Commit and push to master
        if: steps.check.outputs.pages_done == 'false' || steps.check.outputs.extras_done == 'false'
        run: |
          for f in docs/creamy.html docs/alerts.html \
                   docs/multibagger.html docs/index.html docs/apex.html \
                   docs/sectors.html docs/indian-research.html docs/confluence.html \
                   docs/debate.html docs/debate-data.json \
                   docs/prediction.html docs/prediction-history.json \
                   docs/regime.json docs/screener-stats.json screener-outcomes.json \
                   screener-weights.json \
                   docs/macro.json docs/bestpicks.html docs/bestpicks-tickers.json \
                   docs/feature-report.json feature-history.jsonl \
                   docs/delivery.json docs/rocket.html docs/rocket-tickers.json docs/rocket-diagnostics.json \
                   docs/earnings-calendar.json docs/fii-dii.json \
                   docs/surveillance.json docs/deals.json docs/fiidii.html docs/sniper.html docs/investors.html \
                   docs/apex-tickers.json docs/creamy-tickers.json docs/multibagger-tickers.json \
                   docs/indianresearch-tickers.json docs/pipeline-audit.json \
                   docs/breakout2.html docs/breakout2-data.json docs/nse-tickers.json \
                   docs/triggers.html docs/triggers.json \
                   docs/factor-lab.json docs/score-lab.json docs/ai-research-audit.json; do
            [ -f "$f" ] && git add -f "$f" || true
          done
          bash scripts/ci-git-push.sh "data: daily refresh $(date -u +%Y-%m-%d)"

      - name: Nothing to do today
        if: steps.check.outputs.pages_done == 'true' && steps.check.outputs.extras_done == 'true'
        run: echo "All daily work already completed today — success"
