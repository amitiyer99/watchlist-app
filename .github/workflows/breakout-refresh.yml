name: Breakout Scanner Refresh

on:
  schedule:
    - cron: '15,45 3-9 * * 1-5'
    - cron: '0 4-10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: master-data-push
  cancel-in-progress: false

jobs:
  refresh-breakout:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Check if breakout was refreshed recently (25-min cooldown)
        id: check
        run: |
          LAST_TS=$(git log -1 --format="%ct" -- docs/breakout2.html 2>/dev/null || echo "0")
          NOW_TS=$(date +%s)
          AGE=$(( NOW_TS - LAST_TS ))
          echo "Breakout2 last committed ${AGE}s ago"
          if [ "$AGE" -lt "1500" ] && [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Skipping — refreshed only ${AGE}s ago (cooldown 1500s)"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate Breakout v1
        if: steps.check.outputs.skip == 'false'
        continue-on-error: true
        run: node generate-breakout.js

      - name: Generate Breakout Gen2 + sidecar JSON + NSE ticker DB
        if: steps.check.outputs.skip == 'false'
        run: node generate-breakout2.js

      - name: Generate live prices
        if: steps.check.outputs.skip == 'false'
        continue-on-error: true
        run: node generate-prices.js

      - name: Generate Top 50 Potential Stocks
        if: steps.check.outputs.skip == 'false'
        continue-on-error: true
        run: node generate-potential.js

      - name: Refresh market regime snapshot
        if: steps.check.outputs.skip == 'false'
        continue-on-error: true
        run: node generate-regime.js

      - name: Generate right-time Triggers
        if: steps.check.outputs.skip == 'false'
        run: node generate-triggers.js

      - name: Commit and push to master
        if: steps.check.outputs.skip == 'false'
        run: |
          for f in docs/breakout.html docs/breakout2.html docs/breakout2-data.json \
                   docs/nse-tickers.json docs/live-prices.json docs/potential.html \
                   docs/regime.json docs/triggers.html docs/triggers.json \
                   screener-outcomes.json; do
            [ -f "$f" ] && git add -f "$f" || true
          done
          bash scripts/ci-git-push.sh "data: breakout refresh $(date -u +'%H:%M') UTC"
