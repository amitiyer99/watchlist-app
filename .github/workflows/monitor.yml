name: Stock Price Monitor

on:
  schedule:
    - cron: '*/10 3-10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: master-data-push
  cancel-in-progress: false

jobs:
  check-prices:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Run stock price check
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: node monitor.js --once

      - name: Generate live prices
        continue-on-error: true
        run: node generate-prices.js

      - name: Generate debate + prediction (lightweight refresh)
        continue-on-error: true
        run: |
          node generate-debate.js
          node generate-prediction.js

      - name: Commit and push to master
        run: |
          [ -f "docs/live-prices.json" ] && git add -f docs/live-prices.json || true
          [ -f "docs/debate.html" ] && git add -f docs/debate.html || true
          [ -f "docs/debate-data.json" ] && git add -f docs/debate-data.json || true
          [ -f "docs/prediction.html" ] && git add -f docs/prediction.html || true
          [ -f "docs/prediction-history.json" ] && git add -f docs/prediction-history.json || true
          bash scripts/ci-git-push.sh "data: prices $(date -u +'%H:%M') UTC"
